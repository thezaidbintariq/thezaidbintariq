name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D97757&color_dots=#F0EEE6,#EBCBB9,#E3A88C,#D97757,#B5583A
            dist/github-snake-dark.svg?color_snake=#D97757&color_dots=#262624,#5A3A2E,#8A4E38,#B5583A,#D97757&color_background=#141413
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
